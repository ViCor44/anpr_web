<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Histórico — ANPR VIGI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Histórico de eventos</h1>
      <div class="muted">Todos os snapshots e leituras</div>
    </div>
    <div class="top-actions">
      <a class="linkbtn secondary" href="/">← Voltar</a>
      <a class="linkbtn secondary" href="/logout">Sair</a>
    </div>
  </header>

  <main style="padding:20px">
    <div class="card">
      <div class="card-header">
        <h2>Eventos</h2>
        <div class="muted" id="counter">A carregar…</div>
      </div>
      <div id="events"></div>
    </div>
  </main>

  <div id="lightbox" class="image-viewer" hidden role="dialog" aria-modal="true" aria-label="Imagem ampliada do evento">
    <button type="button" id="lightbox-close" class="image-viewer-close" aria-label="Fechar imagem">&times;</button>
    <label class="image-zoom-control" for="lightbox-zoom">
      Zoom <input id="lightbox-zoom" type="range" min="100" max="300" step="10" value="100">
      <output id="lightbox-zoom-value" for="lightbox-zoom">100%</output>
    </label>
    <div class="image-viewer-stage">
      <img id="lightbox-img" alt="Imagem ampliada do evento">
    </div>
  </div>

  <script>
    function fmtConfidence(v){ return v==null ? "--" : `${Math.round(v*100)}%`; }
    function eventTitle(ev){
      if(ev.event_type==="manual_open") return "Abertura manual";
      if(ev.event_type==="camera_snapshot") return "Snapshot da câmara";
      if(ev.event_type==="anpr_authorized") return "ANPR autorizado";
      if(ev.event_type==="anpr_denied") return "ANPR negado";
      return ev.event_type;
    }
    function eventClass(ev){
      if(ev.event_type==="manual_open") return "warn";
      if(ev.authorized===1) return "ok";
      if(ev.authorized===0) return "bad";
      return "";
    }
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-img");
    const lightboxZoom = document.getElementById("lightbox-zoom");
    const lightboxZoomValue = document.getElementById("lightbox-zoom-value");

    function updateLightboxZoom(){
      const zoom = Number(lightboxZoom.value) / 100;
      lightboxZoomValue.value = `${lightboxZoom.value}%`;
      lightboxZoomValue.textContent = `${lightboxZoom.value}%`;
      if (!lightboxImage.naturalWidth || !lightboxImage.naturalHeight) return;
      const fit = Math.min(
        (window.innerWidth * 0.95) / lightboxImage.naturalWidth,
        (window.innerHeight * 0.78) / lightboxImage.naturalHeight
      );
      lightboxImage.style.width = `${lightboxImage.naturalWidth * fit * zoom}px`;
    }

    function closeLightbox(){
      lightbox.hidden = true;
      lightboxImage.removeAttribute("src");
      lightboxImage.style.removeProperty("width");
    }

    function openLightbox(src){
      lightboxZoom.value = "100";
      lightboxImage.src = src;
      lightbox.hidden = false;
      updateLightboxZoom();
    }
    lightboxZoom.addEventListener("input", updateLightboxZoom);
    lightboxImage.addEventListener("load", updateLightboxZoom);
    document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeLightbox();
    });
    window.addEventListener("resize", updateLightboxZoom);

    async function load(){
      const r = await fetch("/api/events/all?limit=500");
      const events = await r.json();
      document.getElementById("counter").textContent = `${events.length} eventos`;
      const el = document.getElementById("events");
      el.innerHTML = "";
      for(const ev of events){
        const row = document.createElement("div");
        row.className = "event";
        const img = ev.snapshot_path
          ? `<button type="button" class="event-snapshot" aria-label="Ampliar imagem do evento">
               <img src="/${ev.snapshot_path}" alt="Imagem do evento">
             </button>`
          : `<div style="width:96px;height:72px;background:#000;border-radius:8px"></div>`;
        row.innerHTML = `
          ${img}
          <div>
            <div class="event-title ${eventClass(ev)}">${eventTitle(ev)}</div>
            <div class="muted">${ev.ts}</div>
            ${ev.plate ? `<div>Matrícula: <strong>${ev.plate}</strong></div>` : ""}
            ${ev.confidence!=null ? `<div>Confiança: ${fmtConfidence(ev.confidence)}</div>` : ""}
            ${ev.client_ip ? `<div>Origem: ${ev.client_name ? `${ev.client_name} · ` : ""}${ev.client_ip}</div>` : ""}
            ${ev.note ? `<div class="muted">${ev.note}</div>` : ""}
          </div>
        `;
        row.querySelector(".event-snapshot")?.addEventListener("click", () => {
          openLightbox(`/${ev.snapshot_path}`);
        });
        el.appendChild(row);
      }
    }
    load();
  </script>
</body>
</html>
